# Project rieng de 3 stack khong ghi de image/volume cua nhau.
name: chat-service-prod

# Stack chay that tren VPS. Khac docker-compose.yml (prod-like de thu o may):
#   - KHONG publish cong Postgres/Redis ra ngoai (chi noi bo trong network docker)
#   - app chi lang nghe 127.0.0.1 -> dat sau nginx/Caddy co TLS
#   - moi bi mat doc tu file .env (khong hardcode trong compose)
#   - restart: unless-stopped + gioi han log
#
#   cp .env.production.example .env && nano .env      # dien bi mat
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?dat POSTGRES_USER trong .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?dat POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:?dat POSTGRES_DB trong .env}
    volumes:
      # Volume rieng cho prod: dung chung ten voi stack demo se dinh du lieu cu
      # (Postgres chi tao user/mat khau o lan chay dau tien tren volume rong).
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Prod BAT BUOC co mat khau: thieu REDIS_PASSWORD la compose dung ngay.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD bat buoc o prod (xem docs/deploy.md#chạy-thật-production)}
    command:
      - sh
      - -c
      - exec redis-server --appendonly no --save "" --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"
    # Khong restart: migration loi thi phai thay ngay, khong de lap vo han.
    restart: "no"
    logging: *logging

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    env_file: [.env]
    environment:
      APP_ENV: prod
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      POSTGRES_DSN: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      REDIS_ENABLED: "true"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD bat buoc o prod}
      POSTGRES_AUTO_MIGRATE: "false"
      AUTH_ALLOW_DEV_TOKEN: "false"
      WEB_DEMO_DIR: ""           # tat trang thu tay o production
      GRPC_REFLECTION: "false"
      LOG_LEVEL: "info"
      LOG_FORMAT: "json"
    ports:
      # Chi mo tren loopback: nginx/Caddy o host se proxy vao (xem docs/deploy.md#chạy-thật-production).
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    logging: *logging

volumes:
  pgdata-prod:
