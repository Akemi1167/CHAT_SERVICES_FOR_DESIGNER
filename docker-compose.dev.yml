# Project rieng de 3 stack khong ghi de image/volume cua nhau.
name: chat-service-dev

# Stack DEV: source duoc mount vao container, air tu build lai khi sua code.
#   make dev-up      -> chay
#   make dev-logs    -> xem log
#   make dev-sh      -> vao shell container
#
# Khac voi docker-compose.yml (prod-like: build binary vao image).
services:
  postgres:
    image: postgres:16-alpine
    container_name: chat-postgres-dev
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chat-redis-dev
    # Co REDIS_PASSWORD trong .env thi bat --requirepass; de trong thi chay nhu cu.
    # $${...} = shell trong container tu dien, $${} khong bi compose nuot.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - exec redis-server --appendonly no $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli $${REDIS_PASSWORD:+-a "$$REDIS_PASSWORD"} ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    container_name: chat-migrate-dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://chat:chat@postgres:5432/chat?sslmode=disable"
      - "up"

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: chat-app-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: [.env]          # lay CMS_*, CHAT_SERVICE_KEY... tu .env (khong hardcode bi mat)
    environment:
      APP_ENV: local
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      POSTGRES_DSN: "postgres://chat:chat@postgres:5432/chat?sslmode=disable"
      # Cac cong tac debug: lay tu .env neu co, khong thi dung mac dinh cua dev.
      # (environment: de GIA TRI CO DINH se de len env_file, sua .env se khong an.)
      POSTGRES_LOG_SQL: "${POSTGRES_LOG_SQL:-false}"    # bat khi can xem cau SQL
      POSTGRES_LOG_PRETTY: "${POSTGRES_LOG_PRETTY:-true}" # SQL nhieu dong + mau, chi dev
      REDIS_ENABLED: "true"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "doi-secret-nay-trong-moi-truong-that"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      LOG_FORMAT: "${LOG_FORMAT:-text}"
      # LOG_FILE / LOG_STDOUT lay tu .env (xem docs/08-docker.md muc 3).
      # TASK_ENGINE_ENABLED / CMS_* lay tu .env (xem docs/15-cms-cutover.md).
    tty: true                       # cap TTY => SQL pretty log co mau trong `make dev-logs`
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - .:/app                      # source that: sua la container build lai
      - go-mod-cache:/go/pkg/mod    # cache module giua cac lan chay
      - go-build-cache:/root/.cache/go-build

volumes:
  pgdata-dev:
  go-mod-cache:
  go-build-cache:
