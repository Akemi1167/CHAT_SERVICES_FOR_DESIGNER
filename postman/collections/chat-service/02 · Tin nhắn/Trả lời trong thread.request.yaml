$kind: http-request
description: "`thread_id` = id tin nhắn gốc (hoặc card task). Phản hồi hiện cả trong nhóm và trong thread."
url: "{{base_url}}/api/v1/conversations/{{conversation_id}}/messages"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "content": "Phản hồi trong thread của nhiệm vụ",
      "thread_id": "{{thread_id}}",
      "client_msg_id": "{{$guid}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("200/201 OK", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
    language: text/javascript
order: 3000
