$kind: http-request
description: "Giống panel thread trong demo: mọi tin trong thread, sắp xếp cũ → mới."
url: "{{base_url}}/api/v1/messages/{{message_id}}/replies?mode=thread&limit=50"
method: GET
queryParams:
  mode: thread
  limit: "50"
scripts:
  - type: afterResponse
    code: |-
      pm.test("200/201 OK", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      pm.test("replies la mang", () => pm.expect(pm.response.json().data.replies).to.be.an("array"));
    language: text/javascript
order: 6000
