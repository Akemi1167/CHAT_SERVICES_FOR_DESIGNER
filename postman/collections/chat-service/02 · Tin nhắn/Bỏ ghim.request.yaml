$kind: http-request
url: "{{base_url}}/api/v1/messages/{{message_id}}/pin"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "pinned": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200/201 OK", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      pm.test("da bo ghim", () => pm.expect(pm.response.json().data.pinned).to.be.false);
    language: text/javascript
order: 14000
