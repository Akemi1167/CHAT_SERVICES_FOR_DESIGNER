$kind: http-request
description: |-
  Hai quan hệ khác nhau:

  - `reply_to_id` = tin được **trích dẫn** (nút Reply trên UI)
  - `thread_id` = tin **mở thread** (card yêu cầu) — phản hồi hiện cả trong nhóm và trong thread

  Cả hai phải thuộc cùng hội thoại, nếu không → 400 `invalid_reply_to_id` / `invalid_thread_id`.
url: "{{base_url}}/api/v1/conversations/{{conversation_id}}/messages"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "content": "Mình nhận nhé",
      "reply_to_id": "{{message_id}}",
      "thread_id": "{{thread_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200/201 OK", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      const m = pm.response.json().data.message;
      pm.collectionVariables.set("reply_message_id", m.id);
      pm.test("co reply_to_id", () => pm.expect(m.reply_to_id).to.be.a("string"));
    language: text/javascript
order: 4000
