$kind: http-request
description: "`role`: leader (tổ trưởng) | assistant (trợ lý) | member. Thêm lại → idempotent."
url: "{{base_url}}/api/v1/teams/{{team_id}}/members"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "user_ids": [
        "{{user_id}}"
      ],
      "role": "member"
    }
scripts:
  - type: afterResponse
    code: pm.test("200/201 OK", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
    language: text/javascript
order: 2000
