$kind: http-request
description: "`kind`: design | edit | order | other."
url: "{{base_url}}/api/v1/teams"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "design-2",
      "name": "Tổ Design 2",
      "kind": "design"
    }
scripts:
  - type: afterResponse
    code: pm.test("201 hoặc 409 nếu đã tồn tại", () => pm.expect(pm.response.code).to.be.oneOf([200, 201, 409]));
    language: text/javascript
order: 5000
