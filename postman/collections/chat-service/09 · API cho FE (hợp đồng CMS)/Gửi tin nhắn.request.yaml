$kind: http-request
description: Chat lưu + phát realtime + gửi `message.created` sang CMS (bất đồng bộ qua outbox).
url: "{{base_url}}/api/client/v1/chat/groups/{{chat_id}}/messages"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "text": "Nhờ team làm gấp giúp mình nhé",
      "clientMsgId": "{{$guid}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{cms_token}}"
scripts:
  - type: afterResponse
    code: pm.test("200/201 OK", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
    language: text/javascript
order: 5000
