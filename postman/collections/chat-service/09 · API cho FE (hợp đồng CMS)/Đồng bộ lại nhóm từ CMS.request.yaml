$kind: http-request
description: Gọi sau khi user vào nhóm bằng link mời.
url: "{{base_url}}/api/client/v1/chat/groups/refresh"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{cms_token}}"
scripts:
  - type: afterResponse
    code: pm.test("200 (OK) / 400 (chua bat CMS) / 403 (token khong thuoc nhom)", () => pm.expect(pm.response.code).to.be.oneOf([200, 400, 403]));
    language: text/javascript
order: 3000
