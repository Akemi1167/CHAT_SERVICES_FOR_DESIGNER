$kind: http-request
description: |-
  Chat kiểm `visibleTo` trước (không được phép → `403 ACTION_NOT_ALLOWED`), rồi gửi `card.action` sang CMS và áp card mới nếu `cardVersion` lớn hơn.

  Chế độ fake (chưa bật CMS) hoặc tin nhắn không phải card → `400 cms_disabled` / `400 message_has_no_card`.
url: "{{base_url}}/api/client/v1/chat/messages/{{card_message_id}}/actions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "action": "accept_task",
      "values": {
        "normItemId": "996802",
        "quantity": 2
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{cms_token}}"
scripts:
  - type: afterResponse
    code: pm.test("200 (CMS) hoac 400/403 (fake / khong co quyen)", () => pm.expect(pm.response.code).to.be.oneOf([200, 400, 403]));
    language: text/javascript
order: 7000
