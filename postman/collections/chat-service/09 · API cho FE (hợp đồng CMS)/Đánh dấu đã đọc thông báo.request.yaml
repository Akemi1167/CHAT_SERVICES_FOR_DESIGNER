$kind: http-request
url: "{{base_url}}/api/client/v1/chat/notifications/read"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "all": true
    }
auth:
  type: bearer
  credentials:
    token: "{{cms_token}}"
scripts:
  - type: afterResponse
    code: pm.test("200/201 OK", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
    language: text/javascript
order: 10000
