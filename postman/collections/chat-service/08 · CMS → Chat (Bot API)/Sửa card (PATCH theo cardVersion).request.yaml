$kind: http-request
description: Chỉ áp dụng khi `cardVersion` **lớn hơn** bản đang lưu; nhỏ hơn/bằng → `{"ok":true,"ignored":true}`.
url: "{{base_url}}/bot/v1/messages/{{card_message_id}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "card": {
        "schema": "abc.card/v1",
        "header": {
          "code": "WEB-20261118-0006",
          "title": "Banner Tết 2027",
          "status": {
            "text": "Đang làm",
            "tone": "info"
          }
        },
        "elements": [
          {
            "type": "button",
            "text": "Nộp bài",
            "action": "submit_work"
          }
        ]
      },
      "cardVersion": 2
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("200/201 OK", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      pm.test("ok", () => pm.expect(pm.response.json().ok).to.be.true);
    language: text/javascript
order: 3000
