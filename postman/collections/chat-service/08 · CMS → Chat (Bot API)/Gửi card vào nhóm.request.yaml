$kind: http-request
description: "`groupId` nhận cả `wg_…` của CMS lẫn UUID nội bộ. Trả `{messageId, cardVersion}`."
url: "{{base_url}}/bot/v1/messages"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "groupId": "{{chat_id}}",
      "bot": {
        "id": 1,
        "name": "Demo Designer Bot"
      },
      "card": {
        "schema": "abc.card/v1",
        "header": {
          "code": "WEB-20261118-0006",
          "kind": "DESIGN",
          "title": "Banner Tết 2027",
          "status": {
            "text": "Chưa nhận",
            "tone": "warning"
          }
        },
        "visibleTo": null,
        "elements": [
          {
            "type": "button",
            "text": "Nhận task",
            "action": "accept_task",
            "visibleTo": [
              "{{actor_id}}"
            ]
          }
        ]
      }
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("200/201 OK", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      const d = pm.response.json();
      pm.collectionVariables.set("card_message_id", d.messageId);
      pm.test("cardVersion = 1", () => pm.expect(d.cardVersion).to.eql(1));
    language: text/javascript
order: 2000
