$kind: http-request
description: |-
  `status`: `on` → online; `off` **kèm `reason`** → `off_duty` (hiện chữ OFF cạnh tên); `off` không reason → offline. Actor không tồn tại thì bị bỏ qua, không lỗi.

  Chat phát event realtime `presence` cho những người **chung hội thoại** với người đó.
url: "{{base_url}}/bot/v1/presence"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "items": [
        {
          "actorId": "{{actor_id}}",
          "status": "off",
          "reason": "Lịch OFF ca chiều"
        }
      ]
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("200/201 OK", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      pm.test("co so dong cap nhat", () => pm.expect(pm.response.json().updated).to.be.a("number"));
    language: text/javascript
order: 8000
