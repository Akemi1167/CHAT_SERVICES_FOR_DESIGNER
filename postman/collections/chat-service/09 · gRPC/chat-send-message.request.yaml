$kind: grpc-request
name: ChatService/SendMessage
description: |
  Dùng khi service khác muốn đăng tin nhắn vào chat (vd service đơn hàng, Drive). Gửi lại cùng client_msg_id → trả tin cũ.
url: '{{grpc_url}}'
methodPath: chat.v1.ChatService/SendMessage
message:
  content: |-
    {
      "conversation_id": "{{conversation_id}}",
      "type": "MESSAGE_TYPE_TEXT",
      "content": "Tin nhắn gửi qua gRPC",
      "client_msg_id": "{{$guid}}",
      "metadata_json": "{\"task_code\":\"{{task_code}}\"}"
    }
metadata:
  - key: authorization
    value: 'Bearer {{token}}'
settings:
  secureConnection: false
  strictSSL: false
  includeDefaultFields: true
order: 2000
