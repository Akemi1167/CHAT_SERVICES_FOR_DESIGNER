$kind: grpc-request
name: TaskService/CreateRevision
description: |
  Phiếu sửa: card đã hoàn thành sẽ tự mở lại để sửa.
url: '{{grpc_url}}'
methodPath: chat.v1.TaskService/CreateRevision
message:
  content: |-
    {
      "task_id": "{{task_id}}",
      "reason": "Lệch khung",
      "revision_type": "layout",
      "quantity": 2
    }
metadata:
  - key: authorization
    value: 'Bearer {{token}}'
settings:
  secureConnection: false
  strictSSL: false
  includeDefaultFields: true
order: 8000
