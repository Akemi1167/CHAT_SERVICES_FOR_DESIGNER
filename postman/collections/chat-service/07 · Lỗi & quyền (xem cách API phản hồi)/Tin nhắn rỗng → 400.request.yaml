$kind: http-request
url: "{{base_url}}/api/v1/conversations/{{conversation_id}}/messages"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "content": "   "
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("400", () => pm.response.to.have.status(400));
      pm.test("code empty_message", () => pm.expect(pm.response.json().error.code).to.eql("empty_message"));
    language: text/javascript
order: 5000
