$kind: http-request
description: "Code: `route_not_found`. Lỗi của Fiber (404/405/413/upgrade) được map sang đúng status thay vì 500."
url: "{{base_url}}/api/v1/khong-co-endpoint-nay"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("404", () => pm.response.to.have.status(404));
      pm.test("code route_not_found", () => pm.expect(pm.response.json().error.code).to.eql("route_not_found"));
    language: text/javascript
order: 4000
