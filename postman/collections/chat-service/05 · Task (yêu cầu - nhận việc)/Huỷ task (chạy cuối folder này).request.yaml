$kind: http-request
description: Huỷ sẽ thu hồi các card chưa hoàn thành → mọi thao tác sau đó trên task trả 409 `task_cancelled`.
url: "{{base_url}}/api/v1/tasks/{{task_id}}/cancel"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "Khách đổi yêu cầu"
    }
scripts:
  - type: afterResponse
    code: pm.test("200 hoac 403", () => pm.expect(pm.response.code).to.be.oneOf([200, 403]));
    language: text/javascript
order: 17000
