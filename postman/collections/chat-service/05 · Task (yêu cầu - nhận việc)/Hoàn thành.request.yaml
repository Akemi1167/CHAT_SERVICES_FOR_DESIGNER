$kind: http-request
description: Bị chặn (409 `task_has_open_revision`) nếu còn phiếu sửa đang mở. Chuyển trạng thái sai (vd đang `paused` mà hoàn thành) → 409 `invalid_task_transition` kèm `details.allowed`.
url: "{{base_url}}/api/v1/tasks/{{task_id}}/complete"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "note": "Đã nộp file"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200/201 OK", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      pm.test("hoan thanh", () => pm.expect(pm.response.json().data.status).to.eql("completed"));
    language: text/javascript
order: 11000
