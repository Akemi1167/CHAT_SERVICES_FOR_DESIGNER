$kind: http-request
description: Bỏ trống `assignee_ids` → hệ thống tự gợi ý người trong tổ. Người được giao mà chưa ở trong nhóm sẽ được tự thêm vào nhóm.
url: "{{base_url}}/api/v1/tasks"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "conversation_id": "{{conversation_id}}",
      "title": "Video quảng cáo Tết",
      "description": "Dựng 15s theo kịch bản",
      "team_code": "design",
      "quantity": 10,
      "quota": "HD",
      "priority": "high",
      "deadline": "2026-12-20",
      "assignee_ids": [
        "{{user_id}}"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200/201 OK", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      const _d = pm.response.json().data;
      if (_d) { pm.collectionVariables.set("task_id", _d.id); console.log("task_id =", pm.collectionVariables.get("task_id")); }
      pm.collectionVariables.set("task_code", pm.response.json().data.code);
      const a = pm.response.json().data.assignments[0];
      if (a) pm.collectionVariables.set("assignment_id", a.id);
      pm.test("cho nhan", () => pm.expect(pm.response.json().data.status).to.eql("waiting_accept"));
    language: text/javascript
order: 1000
