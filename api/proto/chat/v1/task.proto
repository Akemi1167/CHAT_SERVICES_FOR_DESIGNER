syntax = "proto3";

package chat.v1;

import "chat/v1/common.proto";

option go_package = "github.com/abc-workspace/chat-service/gen/go/chat/v1;chatv1";

// Ghi chu thiet ke: cac truong trang thai/role cua task dung STRING (khong dung enum)
// vi nghiep vu con mo rong (them trang thai moi khong pha vo hop dong) va de
// REST/WebSocket/gRPC dung chung dung 1 bo gia tri.
//   task.status      : waiting_accept | in_progress | paused | on_hold | completed | cancelled
//   assignment.status: pending | in_progress | paused | on_hold | completed | revoked
//   assignment.role  : primary | support | edit
//   task.priority    : low | normal | high | urgent
//   revision.status  : open | completed | cancelled

message Team {
  string id = 1;
  string code = 2;
  string name = 3;
  string kind = 4; // design | edit | order | other
  bool enabled = 5;
}

message TeamMember {
  string id = 1;
  string team_id = 2;
  string user_id = 3;
  string role = 4; // leader | assistant | member
  bool active = 5;
  User user = 6;
}

// Goi y nguoi phu trach: it viec nhat va khong OFF se len dau.
message AssigneeSuggestion {
  string user_id = 1;
  string display_name = 2;
  string avatar_url = 3;
  string team_role = 4;
  string presence = 5;
  int64 open_tasks = 6;
}

message TaskAssignment {
  string id = 1;
  string task_id = 2;
  string user_id = 3;
  string role = 4;
  string status = 5;
  string quota = 6;
  int32 quantity = 7;
  string note = 8;
  string assigned_by = 9;
  string assigned_at = 10;
  string accepted_at = 11;
  string paused_at = 12;
  string held_at = 13;
  string completed_at = 14;
  string revoked_at = 15;
  User user = 16;
}

message TaskRevision {
  string id = 1;
  string code = 2;
  string task_id = 3;
  string assignment_id = 4;
  string reason = 5;
  string revision_type = 6;
  int32 quantity = 7;
  string status = 8;
  string created_by = 9;
  string completed_by = 10;
  string completed_at = 11;
  string created_at = 12;
}

message TaskEvent {
  string id = 1;
  string task_id = 2;
  string assignment_id = 3;
  string revision_id = 4;
  string type = 5;
  string actor_id = 6;
  string from_status = 7;
  string to_status = 8;
  string message = 9;
  string payload_json = 10;
  string created_at = 11;
}

message Task {
  string id = 1;
  string code = 2;
  string conversation_id = 3;
  string thread_id = 4;
  string parent_task_id = 5;
  string team_id = 6;
  string title = 7;
  string description = 8;
  int32 quantity = 9;
  string quota = 10;
  string deadline = 11;
  string priority = 12;
  string status = 13;
  string created_by = 14;
  string completed_at = 15;
  string created_at = 16;
  string metadata_json = 17;
  repeated TaskAssignment assignments = 18;
  repeated TaskRevision revisions = 19;
  Team team = 20;
}

message TaskResponse {
  Task task = 1;
}

message CreateTaskRequest {
  string conversation_id = 1;
  // Rong => card task se tro thanh thread goc cua yeu cau.
  string thread_id = 2;
  string title = 3;
  string description = 4;
  string team_id = 5;
  string team_code = 6;
  int32 quantity = 7;
  string quota = 8;
  string deadline = 9;
  string priority = 10;
  // Rong => he thong tu goi y nguoi phu trach trong to.
  repeated string assignee_ids = 11;
  string parent_task_id = 12;
  string metadata_json = 13;
}

message GetTaskRequest {
  string task_id = 1;
  string code = 2; // dung 1 trong 2
}

message ListTasksRequest {
  string conversation_id = 1;
  string thread_id = 2;
  string team_id = 3;
  string assignee_id = 4;
  string created_by = 5;
  repeated string statuses = 6;
  bool waiting_accept = 7; // chi task da giao chua nhan
  bool mine = 8;           // chi task minh duoc giao
  string query = 9;
  CursorPage page = 10;
}

message ListTasksResponse {
  repeated Task tasks = 1;
  PageInfo page_info = 2;
}

// Dung chung cho AcceptTask / PauseTask / ResumeTask / HoldTask / CompleteTask.
// quota + quantity chi bat buoc khi AcceptTask (nhan task).
message TaskActionRequest {
  string task_id = 1;
  string assignment_id = 2; // rong => card cua chinh nguoi goi
  string note = 3;
  string quota = 4;
  int32 quantity = 5;
}

message UpdateTaskRequest {
  string task_id = 1;
  // Chi gui field muon doi (cac field rong = khong doi).
  string title = 2;
  string description = 3;
  string team_id = 4;
  string team_code = 5;
  int32 quantity = 6;
  string quota = 7;
  string deadline = 8;
  string priority = 9;
  bool clear_deadline = 10;
}

message CancelTaskRequest {
  string task_id = 1;
  string reason = 2;
}

message AddAssigneesRequest {
  string task_id = 1;
  repeated string user_ids = 2;
  string role = 3; // primary | support | edit
  string note = 4;
}

message ReassignTaskRequest {
  string task_id = 1;
  string assignment_id = 2;
  string to_user_id = 3;
  string note = 4;
}

message CreateRevisionRequest {
  string task_id = 1;
  string assignment_id = 2;
  string reason = 3;
  string revision_type = 4;
  int32 quantity = 5;
  string metadata_json = 6;
}

message RevisionResponse {
  TaskRevision revision = 1;
  Task task = 2;
}

message CompleteRevisionRequest {
  string revision_id = 1;
  string note = 2;
}

message ListRevisionsRequest {
  string task_id = 1;
}

message ListRevisionsResponse {
  repeated TaskRevision revisions = 1;
}

message ListTaskEventsRequest {
  string task_id = 1;
  CursorPage page = 2;
}

message ListTaskEventsResponse {
  repeated TaskEvent events = 1;
  PageInfo page_info = 2;
}

message ListTeamsRequest {}

message ListTeamsResponse {
  repeated Team teams = 1;
}

message CreateTeamRequest {
  string code = 1;
  string name = 2;
  string kind = 3;
}

message TeamResponse {
  Team team = 1;
}

message AddTeamMembersRequest {
  string team_id = 1;
  repeated string user_ids = 2;
  string role = 3;
}

message RemoveTeamMemberRequest {
  string team_id = 1;
  string user_id = 2;
}

message RemoveTeamMemberResponse {}

message ListTeamMembersRequest {
  string team_id = 1;
}

message ListTeamMembersResponse {
  repeated TeamMember members = 1;
}

message SuggestAssigneesRequest {
  string team_id = 1;
}

message SuggestAssigneesResponse {
  repeated AssigneeSuggestion suggestions = 1;
}
