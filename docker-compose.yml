# Project rieng de 3 stack khong ghi de image/volume cua nhau.
name: chat-service-demo

services:
  postgres:
    image: postgres:16-alpine
    container_name: chat-postgres
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chat-redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Chay migration roi thoat (app phu thuoc service nay chay xong).
  migrate:
    image: migrate/migrate:v4.17.1
    container_name: chat-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://chat:chat@postgres:5432/chat?sslmode=disable"
      - "up"

  app:
    build: .
    container_name: chat-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: dev
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      POSTGRES_DSN: "postgres://chat:chat@postgres:5432/chat?sslmode=disable"
      REDIS_ENABLED: "true"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "doi-secret-nay-trong-moi-truong-that"
      LOG_LEVEL: "debug"
      LOG_FORMAT: "text"
    ports:
      - "8080:8080"
      - "9090:9090"

volumes:
  pgdata:
