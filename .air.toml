# Hot reload cho chat-service (dung trong container dev).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  include_ext = ["go", "sql", "env"]
  # tmp = thu muc air build vao (DUNG xoa/dung lam cho scratch).
  # scratch = cho de script/probe tam, air bo qua.
  exclude_dir = ["tmp", "scratch", "bin", "docs", "gen", ".git", "postman"]
  exclude_regex = ["_test\\.go"]
  delay = 300
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true

[misc]
  clean_on_exit = true
