$kind: http-request
description: Bắt buộc `reason` + `revision_type`. Bỏ `assignment_id` → tính cho card phụ trách chính.
url: "{{base_url}}/api/v1/tasks/{{task_id}}/revisions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "Sai màu nền so với brief",
      "revision_type": "màu",
      "quantity": 2,
      "assignment_id": "{{assignment_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200/201 OK", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      const d = pm.response.json().data;
      pm.collectionVariables.set("revision_id", d.revision.id);
      pm.test("phieu dang mo", () => pm.expect(d.revision.status).to.eql("open"));
      pm.test("card mo lai", () => pm.expect(d.task.status).to.be.oneOf(["in_progress", "waiting_accept"]));
    language: text/javascript
order: 1000
