$kind: http-request
description: Người phụ trách card hoặc admin. Tin nhắn hệ thống ghi rõ còn bao nhiêu phiếu đang mở.
url: "{{base_url}}/api/v1/revisions/{{revision_id}}/complete"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "note": "Đã sửa lại màu nền"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200/201 OK", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      pm.test("da hoan thanh", () => pm.expect(pm.response.json().data.revision.status).to.eql("completed"));
    language: text/javascript
order: 3000
