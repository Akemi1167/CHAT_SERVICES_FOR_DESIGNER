$kind: http-request
description: Thiếu `quantity` → `400 accept_requires_quantity`; task đã nhận rồi → `409`.
url: "{{base_url}}/api/v1/tasks/{{task_id}}/accept"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "quota": "HD"
    }
scripts:
  - type: afterResponse
    code: pm.test("400 hoặc 409", () => pm.expect(pm.response.code).to.be.oneOf([400, 409]));
    language: text/javascript
order: 16000
