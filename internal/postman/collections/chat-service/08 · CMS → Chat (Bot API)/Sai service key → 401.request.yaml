$kind: http-request
description: Gửi khoá sai để xem dạng lỗi `{code, message, retryable}`.
url: "{{base_url}}/bot/v1/users/resolve"
method: POST
headers:
  Content-Type: application/json
  X-Chat-Service-Key: khoa-sai-co-y
body:
  type: json
  content: |-
    {
      "items": []
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("401", () => pm.response.to.have.status(401));
      pm.test("code invalid_service_key", () => pm.expect(pm.response.json().code).to.eql("invalid_service_key"));
    language: text/javascript
order: 10000
