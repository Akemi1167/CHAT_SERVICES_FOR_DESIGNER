$kind: http-request
description: FE gửi `teamId` trong `values`; Chat **không diễn giải**, chuyển nguyên sang CMS trong event `form.submit` rồi trả `toast`/`closeForm` cho UI.
url: "{{base_url}}/api/client/v1/chat/forms/create_task/submit"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "values": {
        "kind": "task",
        "title": "Banner Tết 2027",
        "teamId": "27",
        "useAI": false
      },
      "context": {
        "groupId": "{{chat_id}}"
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{cms_token}}"
scripts:
  - type: afterResponse
    code: pm.test("200 (OK) / 400 (chua bat CMS) / 403 (token khong thuoc nhom)", () => pm.expect(pm.response.code).to.be.oneOf([200, 400, 403]));
    language: text/javascript
order: 8000
