$kind: http-request
description: |-
  Card trả về đã **lọc nút theo `visibleTo`** của chính người gọi; `actions` liệt kê action người đó được bấm.

  ⚠️ `cms_token` phải là người **thuộc nhóm** `chat_id`, không thì `403 not_conversation_member`.
url: "{{base_url}}/api/client/v1/chat/groups/{{chat_id}}/messages?limit=30"
method: GET
queryParams:
  limit: "30"
auth:
  type: bearer
  credentials:
    token: "{{cms_token}}"
scripts:
  - type: afterResponse
    code: pm.test("200 (token thuoc nhom) hoac 403 (token khong thuoc nhom)", () => pm.expect(pm.response.code).to.be.oneOf([200, 201, 403]));
    language: text/javascript
order: 4000
