$kind: http-request
description: Trả `root`, `replies` (card đã lọc `visibleTo`), `replyCount`, `threadCount`. `mode=direct` cho trích dẫn, `mode=thread` cho panel thread của card.
url: "{{base_url}}/api/client/v1/chat/messages/{{card_message_id}}/replies?mode=thread&limit=50"
method: GET
queryParams:
  mode: thread
  limit: "50"
auth:
  type: bearer
  credentials:
    token: "{{cms_token}}"
scripts:
  - type: afterResponse
    code: pm.test("200 (token thuoc nhom) hoac 403 (token khong thuoc nhom)", () => pm.expect(pm.response.code).to.be.oneOf([200, 201, 403]));
    language: text/javascript
order: 6000
