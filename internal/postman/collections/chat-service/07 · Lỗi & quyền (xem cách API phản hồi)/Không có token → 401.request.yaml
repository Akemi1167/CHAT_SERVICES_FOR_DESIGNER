$kind: http-request
description: "Code: `unauthenticated`."
url: "{{base_url}}/api/v1/conversations"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("401", () => pm.response.to.have.status(401));
      pm.test("code unauthenticated", () => pm.expect(pm.response.json().error.code).to.eql("unauthenticated"));
    language: text/javascript
order: 1000
