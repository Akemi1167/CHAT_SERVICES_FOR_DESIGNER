$kind: http-request
description: Cần `user_id_2` (gọi `/me` bằng token người thứ 2). Gọi 2 lần trả về **cùng** một hội thoại (chống tạo trùng). Nếu `user_id_2` = chính mình → lỗi `invalid_direct_members`.
url: "{{base_url}}/api/v1/conversations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "type": "direct",
      "member_user_ids": [
        "{{user_id_2}}"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 hoặc 400 nếu chưa có user thứ 2", () => pm.expect(pm.response.code).to.be.oneOf([200, 201, 400]));
      if (pm.response.code < 300) pm.collectionVariables.set("direct_conversation_id", pm.response.json().data.id);
    language: text/javascript
order: 2000
