$kind: http-request
description: "Mới nhất trước, kèm `unread_count`. Trang sau: thêm `cursor` = `meta.next_cursor`."
url: "{{base_url}}/api/v1/conversations?limit=20"
method: GET
queryParams:
  limit: "20"
scripts:
  - type: afterResponse
    code: |-
      pm.test("200/201 OK", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      pm.test("co meta", () => pm.expect(pm.response.json()).to.have.property("meta"));
    language: text/javascript
order: 3000
