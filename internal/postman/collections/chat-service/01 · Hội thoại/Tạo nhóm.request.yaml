$kind: http-request
description: "`type=group` bắt buộc có `name`. Người tạo là `owner`, người được thêm là `member`."
url: "{{base_url}}/api/v1/conversations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "type": "group",
      "name": "Tổ Design · Đơn hàng 11",
      "member_user_ids": []
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200/201 OK", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      const _d = pm.response.json().data;
      if (_d) { pm.collectionVariables.set("conversation_id", _d.id); console.log("conversation_id =", pm.collectionVariables.get("conversation_id")); }
      pm.test("la group", () => pm.expect(pm.response.json().data.type).to.eql("group"));
    language: text/javascript
order: 1000
