$kind: http-request
description: Xác thực token và upsert user. Lưu `user_id` cho các request sau.
url: "{{base_url}}/api/v1/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200/201 OK", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      const _d = pm.response.json().data;
      if (_d) { pm.collectionVariables.set("user_id", _d.user_id); console.log("user_id =", pm.collectionVariables.get("user_id")); }
      pm.test("co external_id", () => pm.expect(pm.response.json().data.external_id).to.be.a("string"));
    language: text/javascript
order: 4000
