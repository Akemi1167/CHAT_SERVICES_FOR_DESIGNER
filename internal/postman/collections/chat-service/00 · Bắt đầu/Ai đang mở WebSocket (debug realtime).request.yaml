$kind: http-request
description: "Trả về các kết nối WebSocket đang mở **trên instance này**. Dùng khi test: mở các tab WS xong thì bấm request này để chắc chắn tab của người nhận còn sống trước khi gửi tin. Chạy nhiều instance thì mỗi instance chỉ thấy kết nối của nó."
url: "{{base_url}}/api/v1/ws/online"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200/201 OK", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      const d = pm.response.json().data;
      console.log("Dang ket noi:", d.instance_total_connections,
        "| users:", (d.online_users || []).map(u => (u.display_name || u.user_id) + "(" + u.connections + ")").join(", "));
      pm.test("co truong instance_total_connections", () => pm.expect(d).to.have.property("instance_total_connections"));
    language: text/javascript
order: 3000
