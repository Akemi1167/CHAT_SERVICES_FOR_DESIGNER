$kind: http-request
description: Trả về `unread_count` còn lại. Mốc đã đọc chỉ tiến, không lùi.
url: "{{base_url}}/api/v1/conversations/{{conversation_id}}/read"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "message_id": "{{message_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200/201 OK", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      pm.test("co unread_count", () => pm.expect(pm.response.json().data).to.have.property("unread_count"));
    language: text/javascript
order: 10000
