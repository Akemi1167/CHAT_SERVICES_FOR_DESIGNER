$kind: http-request
description: |-
  `mode=direct` (mặc định): các tin **trả lời trực tiếp** tin này (`reply_to_id`).
  `mode=thread`: **toàn bộ thread** tin này mở ra (`thread_id`) — dùng cho panel thread của card/yêu cầu.

  Trả về `root` (tin gốc), `replies` (cũ → mới), `reply_count`, `thread_count`; phân trang bằng `cursor` như các API list khác.
url: "{{base_url}}/api/v1/messages/{{message_id}}/replies?mode=direct&limit=30"
method: GET
queryParams:
  mode: direct
  limit: "30"
scripts:
  - type: afterResponse
    code: |-
      pm.test("200/201 OK", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      const d = pm.response.json().data;
      pm.test("co root + replies", () => { pm.expect(d).to.have.property("root"); pm.expect(d.replies).to.be.an("array"); });
      pm.test("reply_count la so", () => pm.expect(d.reply_count).to.be.a("number"));
    language: text/javascript
order: 5000
