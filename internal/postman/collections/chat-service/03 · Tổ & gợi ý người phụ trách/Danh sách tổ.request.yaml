$kind: http-request
description: "Seed sẵn: `design`, `edit`, `order`. Lưu `team_id` của tổ design."
url: "{{base_url}}/api/v1/teams"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200/201 OK", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      const d = pm.response.json().data;
      const design = d.find(t => t.code === "design") || d[0];
      if (design) pm.collectionVariables.set("team_id", design.id);
    language: text/javascript
order: 1000
