$kind: grpc-request
name: TaskService/CreateTask
description: |
  Bỏ trống assignee_ids → tự gợi ý người trong tổ (không OFF + ít việc nhất).
url: '{{grpc_url}}'
methodPath: chat.v1.TaskService/CreateTask
message:
  content: |-
    {
      "conversation_id": "{{conversation_id}}",
      "title": "Task tạo qua gRPC",
      "team_code": "design",
      "quantity": 5,
      "quota": "A3",
      "priority": "high",
      "deadline": "2026-12-25T09:00:00Z"
    }
metadata:
  - key: authorization
    value: 'Bearer {{token}}'
settings:
  secureConnection: false
  strictSSL: false
  includeDefaultFields: true
order: 6000
