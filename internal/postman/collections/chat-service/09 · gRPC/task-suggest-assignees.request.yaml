$kind: grpc-request
name: TaskService/SuggestAssignees
description: |
  Gợi ý người phụ trách của 1 tổ: không OFF trước, rồi ít việc đang mở nhất.
url: '{{grpc_url}}'
methodPath: chat.v1.TaskService/SuggestAssignees
message:
  content: |-
    {"team_id": "{{team_id}}"}
metadata:
  - key: authorization
    value: 'Bearer {{token}}'
settings:
  secureConnection: false
  strictSSL: false
  includeDefaultFields: true
order: 9000
