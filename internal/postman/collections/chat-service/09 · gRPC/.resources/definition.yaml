$kind: collection
name: 09 · gRPC
description: |
  Giao tiếp service-to-service. Server bật **reflection** (`GRPC_REFLECTION=true`) nên Postman
  tự đọc được danh sách service/method — không cần upload file .proto.
  Tắt reflection ở prod thì nạp proto từ `api/proto/chat/v1/`.

  Auth: metadata `authorization: Bearer <JWT>` (giống REST).
  Lỗi trả theo gRPC status code: InvalidArgument / Unauthenticated / PermissionDenied /
  NotFound / AlreadyExists / Internal, message dạng `<code>: <mô tả>`.

  Postman không export được request gRPC ra file v2.1 nên các request này chỉ có trong
  collection v3 (bản trong repo).
order: 10000
