$kind: grpc-request
name: ChatService/ListConversations
description: |
  Danh sách hội thoại của user trong token. Trang sau: page.cursor = page_info.next_cursor.
url: '{{grpc_url}}'
methodPath: chat.v1.ChatService/ListConversations
message:
  content: |-
    {"page": {"limit": 10}}
metadata:
  - key: authorization
    value: 'Bearer {{token}}'
settings:
  secureConnection: false
  strictSSL: false
  includeDefaultFields: true
order: 1000
