$kind: grpc-request
name: BotService/SubmitBotTemplate
description: |
  Gửi mẫu → bot lưu bot_submissions rồi tạo task thật. payload_json là JSON dạng string.
url: '{{grpc_url}}'
methodPath: chat.v1.BotService/SubmitBotTemplate
message:
  content: |-
    {
      "bot_slug": "bot",
      "template_code": "yeu_cau",
      "conversation_id": "{{conversation_id}}",
      "payload_json": "{\"tieu_de\":\"Yêu cầu từ gRPC\",\"to\":\"design\",\"so_luong\":2,\"dinh_muc\":\"A4\"}"
    }
metadata:
  - key: authorization
    value: 'Bearer {{token}}'
settings:
  secureConnection: false
  strictSSL: false
  includeDefaultFields: true
order: 5000
